<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notová challenge</title>
<style>
  :root {
    --bg: #e8eee5;
    --paper: #fbfcfa;
    --ink: #1b2a2f;
    --muted: #5d6f70;
    --line: #c9d4cb;
    --accent: #c2255c;
    --ok: #2f9e5b;
    --bad: #c92a2a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #172226;
      --paper: #1f2e33;
      --ink: #e8f0ea;
      --muted: #94a8a8;
      --line: #35494e;
      --accent: #f06595;
      --ok: #51cf86;
      --bad: #ff6b6b;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 20px 14px 40px;
  }
  main { width: 100%; max-width: 520px; }
  h1 {
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-size: clamp(2rem, 8vw, 2.8rem);
    margin: 8px 0 4px;
    letter-spacing: -0.02em;
  }
  .sub { color: var(--muted); margin: 0 0 22px; }
  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
  }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  input[type=text] {
    width: 100%;
    font: inherit;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
  }
  .levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .level {
    font: inherit; cursor: pointer; padding: 10px 6px; border-radius: 8px;
    border: 2px solid var(--line); background: transparent; color: var(--ink);
    text-align: center;
  }
  .level small { display: block; color: var(--muted); }
  .level[aria-pressed=true] { border-color: var(--accent); }
  button.primary {
    width: 100%; margin-top: 16px; font: inherit; font-weight: 700; font-size: 1.1rem;
    padding: 14px; border: 0; border-radius: 10px; cursor: pointer;
    background: var(--accent); color: #fff;
  }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
  th, td { text-align: left; padding: 8px 4px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  td.t { text-align: right; font-variant-numeric: tabular-nums; }
  th.t { text-align: right; }
  h2 { font-size: 1.05rem; margin: 0 0 8px; }

  .hidden { display: none !important; }

  .hud { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 8px; }
  .bar { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; margin-bottom: 14px; }
  .bar > div { height: 100%; width: 100%; background: var(--accent); }
  svg.staff { width: 100%; height: auto; display: block; }
  .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
  .answers button {
    font: inherit; font-size: 1.8rem; font-weight: 700; padding: 18px 0; cursor: pointer;
    border-radius: 12px; border: 2px solid var(--line); background: var(--paper); color: var(--ink);
  }
  .answers button:active { transform: scale(0.98); }
  .answers button.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
  .answers button.bad { background: var(--bad); border-color: var(--bad); color: #fff; }
  .result-big { font-family: Georgia, serif; font-size: 2.4rem; margin: 0 0 6px; }
  .msg { margin: 6px 0 0; color: var(--muted); }
  .hint { color: var(--muted); font-size: 0.85rem; margin-top: 18px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <h1>Notová challenge</h1>
  <p class="sub">Poznej noty od malého c po c'' v houslovém klíči.</p>

  <!-- ÚVOD -->
  <section id="start">
    <div class="card">
      <label for="name">Tvoje jméno</label>
      <input id="name" type="text" maxlength="20" placeholder="Např. Honza" autocomplete="off">
      <div class="levels" id="levels">
        <button class="level" data-sec="5" aria-pressed="false">Lehká<small>5 s</small></button>
        <button class="level" data-sec="4" aria-pressed="true">Střední<small>4 s</small></button>
        <button class="level" data-sec="3" aria-pressed="false">Těžká<small>3 s</small></button>
      </div>
      <button class="primary" id="go">Začít kvíz</button>
    </div>

    <div class="card">
      <h2>Rekordy – 10 správně za sebou</h2>
      <table>
        <thead><tr><th>Obtížnost</th><th>Rekordman</th><th class="t">Čas</th></tr></thead>
        <tbody id="records"></tbody>
      </table>
    </div>
    <p class="hint">Rekord platí jen za 10 správných odpovědí z 10. Do času se počítá rychlost tvých odpovědí. Odpovídat můžeš i klávesami 1–4.</p>
  </section>

  <!-- KVÍZ -->
  <section id="game" class="hidden">
    <div class="hud"><span id="qnum">1 / 10</span><span id="score">Správně: 0</span></div>
    <div class="bar"><div id="timer"></div></div>
    <div class="card" style="padding:10px 14px">
      <svg id="staff" class="staff" viewBox="0 0 320 190" role="img" aria-label="Nota na notové osnově"></svg>
    </div>
    <div class="answers" id="answers"></div>
  </section>

  <!-- VÝSLEDEK -->
  <section id="end" class="hidden">
    <div class="card">
      <p class="result-big" id="endTitle"></p>
      <p class="msg" id="endMsg"></p>
      <button class="primary" id="again">Hrát znovu</button>
    </div>
  </section>
</main>

<script>
(function () {
  "use strict";

  // ---- Data ----------------------------------------------------------
  // krok 0 = e' (spodní linka), každý krok o půl rozestupu nahoru
  var NOTES = [
    { name: "C", step: -2 }, // c'
    { name: "D", step: -1 },
    { name: "E", step: 0 },
    { name: "F", step: 1 },
    { name: "G", step: 2 },
    { name: "A", step: 3 },
    { name: "H", step: 4 },
    { name: "C", step: 5 }  // c''
  ];
  var LETTERS = ["C", "D", "E", "F", "G", "A", "H"];
  var LEVELS = { 5: "Lehká", 4: "Střední", 3: "Těžká" };
  var QUESTIONS = 10;
  var STORE = "notova-challenge-v1";

  // ---- Úložiště (localStorage v prohlížeči) --------------------------
  function load() {
    try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { return {}; }
  }
  function save(data) {
    try { localStorage.setItem(STORE, JSON.stringify(data)); } catch (e) {}
  }
  var store = load();
  store.records = store.records || {};

  // ---- Prvky ---------------------------------------------------------
  var $ = function (id) { return document.getElementById(id); };
  var elStart = $("start"), elGame = $("game"), elEnd = $("end");
  var elName = $("name"), elTimer = $("timer"), elAnswers = $("answers"), elStaff = $("staff");
  var sec = 4;

  elName.value = store.name || "";

  function fmt(t) { return t.toFixed(2).replace(".", ",") + " s"; }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function renderRecords() {
    var rows = "";
    [5, 4, 3].forEach(function (s) {
      var r = store.records[s];
      rows += "<tr><td>" + LEVELS[s] + " (" + s + " s)</td><td>" +
        (r ? esc(r.name) : "–") + '</td><td class="t">' + (r ? fmt(r.time) : "–") + "</td></tr>";
    });
    $("records").innerHTML = rows;
  }

  // ---- Obtížnost -----------------------------------------------------
  document.querySelectorAll(".level").forEach(function (b) {
    b.addEventListener("click", function () {
      document.querySelectorAll(".level").forEach(function (x) { x.setAttribute("aria-pressed", "false"); });
      b.setAttribute("aria-pressed", "true");
      sec = +b.dataset.sec;
    });
  });

  // ---- Kreslení osnovy -----------------------------------------------
  function drawStaff(step) {
    var s = 20;               // rozestup linek
    var bottom = 130;         // y spodní linky (e')
    var x0 = 14, x1 = 306;
    var out = "";
    var ink = "var(--ink)";

    for (var i = 0; i < 5; i++) {
      var y = bottom - i * s;
      out += '<line x1="' + x0 + '" x2="' + x1 + '" y1="' + y + '" y2="' + y + '" stroke="' + ink + '" stroke-width="1.5"/>';
    }

    // houslový klíč (kreslený tahem; počátek = linka g', jednotky = rozestup)
    var gy = bottom - s; // linka g'
    var cx = 62;
    var p = function (a, b) { return (cx + a * s).toFixed(1) + "," + (gy + b * s).toFixed(1); };
    var d = "M" + p(-0.9, 2.0) +
      " C" + p(-0.5, 2.6) + " " + p(0.5, 2.4) + " " + p(0.5, 1.7) +
      " L" + p(0.2, -2.6) +
      " C" + p(0.1, -3.4) + " " + p(0.5, -3.9) + " " + p(0.9, -3.5) +
      " C" + p(1.3, -3.0) + " " + p(0.6, -2.0) + " " + p(-0.2, -1.0) +
      " C" + p(-1.5, 0.2) + " " + p(-1.4, 1.4) + " " + p(-0.2, 1.5) +
      " C" + p(1.0, 1.6) + " " + p(1.5, 0.4) + " " + p(0.9, -0.4) +
      " C" + p(0.4, -1.0) + " " + p(-0.6, -0.7) + " " + p(-0.5, 0.1) +
      " C" + p(-0.4, 0.6) + " " + p(0.2, 0.6) + " " + p(0.3, 0.2);
    out += '<path d="' + d + '" fill="none" stroke="' + ink + '" stroke-width="' + (s * 0.17) +
           '" stroke-linecap="round" stroke-linejoin="round"/>';

    // nota
    var ny = bottom - step * (s / 2);
    var nx = 190;
    if (step <= -2) { // pomocná linka pod osnovou (c')
      out += '<line x1="' + (nx - 22) + '" x2="' + (nx + 22) + '" y1="' + (bottom + s) + '" y2="' + (bottom + s) +
             '" stroke="' + ink + '" stroke-width="1.5"/>';
    }
    out += '<ellipse cx="' + nx + '" cy="' + ny + '" rx="11.5" ry="8.5" transform="rotate(-20 ' + nx + " " + ny +
           ')" fill="' + ink + '"/>';
    var up = step < 4; // stopka nahoru u nižších not, dolů u vyšších
    if (up) {
      out += '<line x1="' + (nx + 10.5) + '" x2="' + (nx + 10.5) + '" y1="' + ny + '" y2="' + (ny - 56) +
             '" stroke="' + ink + '" stroke-width="2"/>';
    } else {
      out += '<line x1="' + (nx - 10.5) + '" x2="' + (nx - 10.5) + '" y1="' + ny + '" y2="' + (ny + 56) +
             '" stroke="' + ink + '" stroke-width="2"/>';
    }
    elStaff.innerHTML = out;
  }

  // ---- Hra -----------------------------------------------------------
  var q, correct, totalTime, current, options, startTs, raf, locked;

  function show(el) {
    [elStart, elGame, elEnd].forEach(function (x) { x.classList.add("hidden"); });
    el.classList.remove("hidden");
  }

  function startGame() {
    store.name = elName.value.trim().slice(0, 20);
    save(store);
    q = 0; correct = 0; totalTime = 0;
    show(elGame);
    nextQuestion();
  }

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function nextQuestion() {
    if (q >= QUESTIONS) return finish();
    q++;
    locked = false;
    var prev = current;
    do { current = NOTES[Math.floor(Math.random() * NOTES.length)]; } while (prev && current.step === prev.step);

    var wrong = shuffle(LETTERS.filter(function (l) { return l !== current.name; })).slice(0, 3);
    options = shuffle(wrong.concat(current.name));

    $("qnum").textContent = q + " / " + QUESTIONS;
    $("score").textContent = "Správně: " + correct;
    drawStaff(current.step);

    elAnswers.innerHTML = "";
    options.forEach(function (o, i) {
      var b = document.createElement("button");
      b.textContent = o;
      b.setAttribute("aria-label", "Odpověď " + (i + 1) + ": " + o);
      b.addEventListener("click", function () { answer(o, b); });
      elAnswers.appendChild(b);
    });

    startTs = performance.now();
    tick();
  }

  function tick() {
    var elapsed = (performance.now() - startTs) / 1000;
    var left = Math.max(0, 1 - elapsed / sec);
    elTimer.style.width = (left * 100) + "%";
    if (elapsed >= sec) { answer(null, null); return; }
    raf = requestAnimationFrame(tick);
  }

  function answer(letter, btn) {
    if (locked) return;
    locked = true;
    cancelAnimationFrame(raf);
    var t = Math.min(sec, (performance.now() - startTs) / 1000);
    var ok = letter === current.name;
    if (ok) { correct++; totalTime += t; }

    Array.prototype.forEach.call(elAnswers.children, function (b) {
      if (b.textContent === current.name) b.classList.add("ok");
    });
    if (btn && !ok) btn.classList.add("bad");
    $("score").textContent = "Správně: " + correct;

    setTimeout(nextQuestion, ok ? 450 : 1000);
  }

  function finish() {
    var perfect = correct === QUESTIONS;
    var title = $("endTitle"), msg = $("endMsg");
    title.textContent = correct + " / " + QUESTIONS + " správně";

    if (!perfect) {
      msg.textContent = "Rekord vyžaduje všech 10 správně. Zkus to znovu!";
    } else {
      var rec = store.records[sec];
      var name = store.name || "Anonym";
      if (!rec || totalTime < rec.time) {
        store.records[sec] = { name: name, time: Math.round(totalTime * 100) / 100 };
        save(store);
        msg.textContent = "Nový rekord (" + LEVELS[sec] + "): " + fmt(totalTime) + ", " + name + "!";
      } else {
        msg.textContent = "Bezchybně, čas " + fmt(totalTime) + ". Rekord " + fmt(rec.time) + " (" + rec.name + ") ale zůstává.";
      }
    }
    show(elEnd);
  }

  // ---- Události ------------------------------------------------------
  $("go").addEventListener("click", startGame);
  $("again").addEventListener("click", function () { renderRecords(); show(elStart); });
  document.addEventListener("keydown", function (e) {
    if (elGame.classList.contains("hidden") || locked) return;
    var i = parseInt(e.key, 10);
    if (i >= 1 && i <= 4) elAnswers.children[i - 1].click();
  });

  renderRecords();
})();
</script>
</body>
</html>
